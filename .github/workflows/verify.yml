name: Verify
on:
  push:
  pull_request:
  schedule:
    # Nightly at 02:17 Australia/Brisbane (UTC+10).
    - cron: '17 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    name: verify (${{ matrix.stage }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: contracts
            command: pnpm test:base && pnpm build:app && pnpm integration:check && pnpm typecheck && pnpm exec rer build --site && node "$(realpath node_modules/@runeditrun/rer/cli/hosted-output.mjs)" . owner-deployment.json && node "$(realpath node_modules/@runeditrun/rer/cli/hydration/check.mjs)" .
          - stage: unit
            command: pnpm test
          - stage: storage and security API
            # Keep ordered storage, media and migration fixtures with their restarts.
            command: pnpm build:app && pnpm test:runtime --suite=core-api-storage
          - stage: product API
            # Independent product journeys keep their existing order and assertions.
            command: pnpm build:app && pnpm test:runtime --suite=core-api-product
          - stage: runtime browser
            # Both widths, Slack import, installed app and homepage remain on every push.
            command: pnpm build:app && pnpm exec rer build --site && pnpm test:runtime --suite=core-browser
          - stage: mattermost import
            command: pnpm build:app && pnpm test:runtime --suite=mattermost-imports
          - stage: campfire import
            command: pnpm build:app && pnpm test:runtime --suite=campfire-imports
          - stage: admin audit
            command: pnpm build:app && node --test tests/audit-runtime.mjs
          - stage: readable exit
            command: pnpm build:app && pnpm test:runtime --suite=readable-export
          - stage: thread delivery
            command: pnpm build:app && node --test --test-concurrency=1 tests/thread-delivery.mjs
          - stage: group conversion
            command: pnpm build:app && pnpm test:runtime --suite=conversion
          - stage: keyboard navigation
            command: pnpm build:app && pnpm test:runtime --suite=keyboard
          - stage: composition
            command: pnpm build:app && pnpm test:runtime --suite=composition
          - stage: search
            command: pnpm build:app && pnpm test:runtime --suite=search
          - stage: integration tokens
            command: pnpm build:app && pnpm test:runtime --suite=integrations && node --test tests/notification-apps.mjs
          - stage: workspaces menu
            command: pnpm build:app && node tests/workspaces-browser.mjs
          - stage: email notifications
            command: pnpm build:app && pnpm test:notify
          - stage: conversation notes
            command: pnpm build:app && pnpm test:notes
          - stage: push notifications
            # The ordered record chain; pnpm test:push runs it and the real-clock shard in turn.
            command: pnpm build:app && node --test --test-concurrency=1 tests/push-journey.mjs
          - stage: push real clocks
            # Real 45-second expiry and five-minute delay waits, alone on a fresh installation.
            command: pnpm build:app && node --test --test-concurrency=1 tests/push-clock.mjs
    uses: ./.github/workflows/verify-stage.yml
    with:
      command: ${{ matrix.command }}

  slow:
    name: verify (${{ matrix.stage }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full fresh-clone journeys retain every assertion; rer verify still
          # runs all stages locally. Only their CI cadence changes.
          - stage: README
            command: pnpm test:readme
          - stage: pilot 1440
            command: pnpm test:pilot --width 1440
          - stage: pilot 390
            command: pnpm test:pilot --width 390
    uses: ./.github/workflows/verify-stage.yml
    with:
      command: ${{ matrix.command }}
      timeout: 120

  installer:
    name: verify (installer)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/verify-stage.yml
    with:
      command: pnpm build:app && pnpm test:runtime --suite=installer
