name: Verify
on:
  push:
  pull_request:
  schedule:
    # Twice weekly, within the fleet's 02:00-08:00 UTC window.
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Only the newest same-repository push of this workflow is evidence.
          # PR merge refs, subset dispatches and this run cannot authorize reuse.
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # Tag doors must still run the release/installer journeys, even on an unchanged tree.
          if [ "$skip" = false ] && [ "$EVENT" = push ] && [[ "$REF" == refs/heads/* ]] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
    uses: ./.github/workflows/verify-stage.yml
    with:
      browser: false
      command: pnpm build:app && pnpm exec rer build --site
      upload-build: true

  fast:
    needs: [plan, build]
    name: verify (${{ matrix.stage }})
    if: needs.plan.outputs.skip != 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Independent commands have isolated runtime stores and ports. Pair
          # clock/IO waits within a runner; do not remove or filter assertions.
          - stage: unit portability
            browser: false
            command: node scripts/ci-unit.mjs portability
          - stage: unit public doors
            browser: true
            command: node scripts/ci-unit.mjs remaining
          - stage: product API
            browser: false
            command: node scripts/ci-stage.mjs 'pnpm test:runtime --suite=core-api-product'
          - stage: runtime browser and exit
            browser: true
            command: node scripts/ci-stage.mjs 'pnpm test:runtime --suite=core-browser' 'pnpm test:runtime --suite=readable-export && pnpm test:runtime --suite=conversion'
          - stage: push and storage
            browser: true
            command: node scripts/ci-stage.mjs 'node --test --test-concurrency=1 tests/push-journey.mjs' 'pnpm test:runtime --suite=core-api-storage && node --test --test-concurrency=1 tests/thread-delivery.mjs && node --test tests/audit-runtime.mjs'
          - stage: imports and navigation
            browser: true
            command: node scripts/ci-stage.mjs 'pnpm test:runtime --suite=mattermost-imports' 'pnpm test:runtime --suite=campfire-imports && node tests/workspaces-browser.mjs && pnpm test:runtime --suite=keyboard'
          - stage: integrations and composition
            browser: true
            command: node scripts/ci-stage.mjs 'node --test tests/notification-apps.mjs' 'pnpm test:runtime --suite=integrations && pnpm test:runtime --suite=composition'
          - stage: notifications and clocks
            browser: true
            command: node scripts/ci-stage.mjs 'pnpm test:notify && pnpm test:notes' 'node src/base/contract-docs.mjs check && pnpm test:base && pnpm integration:check && pnpm typecheck && node "$(realpath node_modules/@runeditrun/rer/cli/hosted-output.mjs)" . owner-deployment.json && node "$(realpath node_modules/@runeditrun/rer/cli/hydration/check.mjs)" . && pnpm test:runtime --suite=search && node --test --test-concurrency=1 tests/push-clock.mjs'
    uses: ./.github/workflows/verify-stage.yml
    with:
      command: ${{ matrix.command }}
      browser: ${{ matrix.browser }}
      download-build: true
      timeout: 30

  slow:
    needs: plan
    name: verify (${{ matrix.stage }})
    if: needs.plan.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full fresh-clone journeys retain every assertion; rer verify still
          # runs all stages locally. Only their CI cadence changes.
          - stage: README
            command: pnpm test:readme
          - stage: pilot 1440
            command: pnpm test:pilot --width 1440
          - stage: pilot 390
            command: pnpm test:pilot --width 390
    uses: ./.github/workflows/verify-stage.yml
    with:
      command: ${{ matrix.command }}
      timeout: 120

  installer:
    needs: plan
    name: verify (installer)
    if: needs.plan.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/verify-stage.yml
    with:
      command: pnpm build:app && pnpm test:runtime --suite=installer


  verify:
    needs: [plan, build, fast, slow, installer]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every applicable stage
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          BUILD: ${{ needs.build.result }}
          FAST: ${{ needs.fast.result }}
          SLOW: ${{ needs.slow.result }}
          INSTALLER: ${{ needs.installer.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            test "$BUILD" = success
            test "$FAST" = success
          fi
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [[ "$REF" == refs/tags/v* ]]; then
            test "$SLOW" = success
            test "$INSTALLER" = success
          fi
