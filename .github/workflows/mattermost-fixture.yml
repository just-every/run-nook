name: Mattermost source fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Start disposable official Mattermost
        run: |
          docker run -d --name nook-mattermost-source --cpus=2 --memory=3g -p 127.0.0.1:8065:8065 \
            -e MM_SERVICESETTINGS_ENABLELOCALMODE=true \
            -e MM_TEAMSETTINGS_ENABLEOPENSERVER=true \
            -e MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION=false \
            mattermost/mattermost-preview:12.0.0@sha256:851453906169c1aa7ef8ad7a3892c8ffc88bd506de181ad9f29d6f135d39e477
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8065/api/v4/system/ping >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Populate and export through real server doors
        env:
          MATTERMOST_ORIGIN: http://127.0.0.1:8065
        run: |
          set -euo pipefail
          mkdir -p fixture
          node tests/mattermost-import/fixtures/populate.mjs --output fixture
          docker exec nook-mattermost-source mmctl export create --local --json > "$RUNNER_TEMP/job.json"
          job=$(jq -r 'if type=="array" then .[0].id else .id end' "$RUNNER_TEMP/job.json")
          test -n "$job" && test "$job" != null
          for i in $(seq 1 120); do
            docker exec nook-mattermost-source mmctl export job show "$job" --local --json > "$RUNNER_TEMP/status.json"
            status=$(jq -r 'if type=="array" then .[0].status else .status end' "$RUNNER_TEMP/status.json")
            if [ "$status" = success ]; then break; fi
            if [ "$status" = error ]; then exit 1; fi
            sleep 2
          done
          test "$status" = success
          docker exec nook-mattermost-source mmctl export list --local --json > "$RUNNER_TEMP/exports.json"
          archive=$(jq -r '.[0]' "$RUNNER_TEMP/exports.json")
          test -n "$archive" && test "$archive" != null
          docker exec nook-mattermost-source mmctl export download "$archive" /tmp/nook-source.zip --local --num-retries 0
          docker cp nook-mattermost-source:/tmp/nook-source.zip fixture/mattermost-export.zip
          sha256sum fixture/mattermost-export.zip
      - uses: actions/upload-artifact@v4
        with:
          name: genuine-mattermost-export
          path: fixture/
          retention-days: 3
      - name: Stop disposable source
        if: always()
        run: docker rm -f nook-mattermost-source
