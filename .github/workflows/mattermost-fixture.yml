name: Mattermost source fixture
on:
  push:
    branches: [sd-nook-p2]
    paths:
      - '.github/workflows/mattermost-fixture.yml'
      - 'tests/mattermost-import/fixtures/populate.mjs'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Start disposable official Mattermost
        run: |
          docker run -d --name nook-mattermost-source --cpus=2 --memory=3g -p 127.0.0.1:8065:8065 \
            -e MM_SERVICESETTINGS_ENABLELOCALMODE=true \
            -e MM_TEAMSETTINGS_ENABLEOPENSERVER=true \
            -e MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION=false \
            -e MM_EXPORTSETTINGS_DIRECTORY=/mattermost/data/export \
            mattermost/mattermost-preview:12.0.0
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8065/api/v4/system/ping >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Populate and export through real server doors
        env:
          MATTERMOST_ORIGIN: http://127.0.0.1:8065
        run: |
          set -euo pipefail
          mkdir -p fixture
          node tests/mattermost-import/fixtures/populate.mjs --output fixture
          docker exec nook-mattermost-source /mattermost/bin/mmctl export create --local --json > "$RUNNER_TEMP/job.json"
          job=$(jq -r 'if type=="array" then .[0].id else .id end' "$RUNNER_TEMP/job.json")
          test -n "$job" && test "$job" != null
          for i in $(seq 1 120); do
            docker exec nook-mattermost-source /mattermost/bin/mmctl export job show "$job" --local --json > "$RUNNER_TEMP/status.json"
            status=$(jq -r 'if type=="array" then .[0].status else .status end' "$RUNNER_TEMP/status.json")
            if [ "$status" = success ]; then break; fi
            if [ "$status" = error ]; then exit 1; fi
            sleep 2
          done
          test "$status" = success
          archive=$(docker exec nook-mattermost-source find /mattermost/data/export -type f -name '*.zip' | head -1)
          test -n "$archive"
          docker cp "nook-mattermost-source:$archive" fixture/mattermost-export.zip
          sha256sum fixture/mattermost-export.zip
      - uses: actions/upload-artifact@v4
        with:
          name: genuine-mattermost-export
          path: fixture/
          retention-days: 3
      - name: Stop disposable source
        if: always()
        run: docker rm -f nook-mattermost-source
