name: Verify stage
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      timeout:
        type: number
        default: 15
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare hosted runner disk capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo 'Disk capacity before removing unused preinstalled toolchains'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # runner-images installs these Android, .NET and Haskell toolchains.
          # This Node/Playwright verification job does not use them.
          sudo rm -rf --one-file-system -- /usr/local/lib/android/sdk /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk capacity after removing unused preinstalled toolchains'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare canonical temporary directory
        run: |
          mkdir -p ../scratch/tmp
          echo "TMPDIR=$(realpath ../scratch/tmp)" >> "$GITHUB_ENV"
      - run: ${{ inputs.command }}
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
