name: Verify stage
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      browser:
        type: boolean
        default: true
      timeout:
        type: number
        default: 15
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare hosted runner disk capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          nook_available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          # Keep fixture headroom; deleting toolchains took 3–5 minutes even
          # on hosted runners with 86 GiB already free.
          if (( nook_available_kib < 15 * 1024 * 1024 )); then
            sudo rm -rf --one-file-system -- /usr/local/lib/android/sdk /usr/share/dotnet /usr/local/.ghcup
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: inputs.browser
        # ubuntu-latest already supplies Chrome's shared libraries. Avoid the
        # redundant apt/font upgrades that consumed 10+ minutes of a job cap.
        run: |
          pnpm exec playwright install chromium
          node --input-type=module -e 'import {chromium} from "@playwright/test"; const browser=await chromium.launch({headless:true,args:["--use-mock-keychain","--password-store=basic"]}); await browser.close()'
      - name: Prepare canonical temporary directory
        run: |
          mkdir -p ../scratch/tmp
          echo "TMPDIR=$(realpath ../scratch/tmp)" >> "$GITHUB_ENV"
      - run: ${{ inputs.command }}
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
          # Migration progress tables can overflow fresh-clone CLI captures.
          WRANGLER_LOG: warn
