name: Verify stage
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      browser:
        type: boolean
        default: true
      upload-build:
        type: boolean
        default: false
      download-build:
        type: boolean
        default: false
      timeout:
        type: number
        default: 15
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: inputs.browser
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          pnpm exec node scripts/chromium-probe.mjs || \
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
          pnpm exec node scripts/chromium-probe.mjs
      - name: Restore shared application and site build
        if: inputs.download-build
        uses: actions/download-artifact@v4
        with:
          name: verify-build-${{ github.sha }}
          path: ${{ runner.temp }}/verify-build
      - name: Unpack shared build
        if: inputs.download-build
        run: tar -xf "$RUNNER_TEMP/verify-build/verify-build.tar"
      - name: Prepare canonical temporary directory
        run: |
          mkdir -p ../scratch/tmp
          echo "TMPDIR=$(realpath ../scratch/tmp)" >> "$GITHUB_ENV"
      - run: ${{ inputs.command }}
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
          # Migration progress tables can overflow fresh-clone CLI captures.
          WRANGLER_LOG: warn
      - name: Pack shared build
        if: inputs.upload-build
        run: tar -cf "$RUNNER_TEMP/verify-build.tar" dist
      - name: Share application and site build
        if: inputs.upload-build
        uses: actions/upload-artifact@v4
        with:
          name: verify-build-${{ github.sha }}
          path: ${{ runner.temp }}/verify-build.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
